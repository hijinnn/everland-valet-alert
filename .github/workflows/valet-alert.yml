name: Valet availability alert

on:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Send a Telegram test message'
        type: boolean
        default: false
      continuous:
        description: 'Keep checking every 20 seconds'
        type: boolean
        default: false
      first_run_seconds:
        description: 'Optional short first run for validation'
        type: number
        default: 0

concurrency:
  group: valet-${{ github.event_name == 'schedule' && 'watch' || inputs.continuous && 'watch' || github.run_id }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check 2026-10-24 valet availability
        run: node check-valet.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
          CONTINUOUS: ${{ inputs.continuous }}
          FIRST_RUN_SECONDS: ${{ inputs.first_run_seconds }}
          GITHUB_TOKEN: ${{ github.token }}
